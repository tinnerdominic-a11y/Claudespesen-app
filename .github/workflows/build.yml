name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.RECEIPTS_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 -d > app/receipts.keystore
      - name: Build APK
        env:
          RECEIPTS_KEYSTORE_PASSWORD: ${{ secrets.RECEIPTS_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Receipts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: receipts-apk
          path: Receipts.apk
      # Every build on main becomes the "latest" release, so this link always gets the newest APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/Receipts.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${BUILD_NUMBER}" Receipts.apk \
            --target "${GITHUB_SHA}" \
            --title "Receipts 1.0.${BUILD_NUMBER}" \
            --notes "Tap Receipts.apk below to download, then open it to install." \
            --latest
